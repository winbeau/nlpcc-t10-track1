[project]
name = "nlpcc-t10-track1"
version = "0.1.0"
description = "NLPCC 2026 Shared Task 10 Track 1 — claim-level faithfulness (Qwen3-VL-8B + LoRA via ms-swift)"
readme = "README.md"
requires-python = ">=3.10"
# Base deps are intentionally minimal so local/light work (data prep, aggregation,
# calling the official evaluator) needs no GPU stack. Heavy deps live in [train].
dependencies = []

[project.optional-dependencies]
# GPU / training stack — install & `uv sync --extra train` ONLY on the remote server.
# NOTE: torch (matching the server's CUDA) is installed separately in scripts/setup_env.sh
# before syncing this extra, since the right wheel index is host-specific.
train = [
    "ms-swift>=3.0",
    "transformers>=4.51",
    "peft>=0.13",
    "accelerate>=1.0",
    "qwen-vl-utils",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlpcc_t10"]
